[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios"
version = "0.1.0"
description = "HELIOS — computational-pathology pipeline for melanoma recurrence-risk prediction from H&E whole-slide images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Semenov Lab" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
helios = "helios.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helios"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer uses function-call defaults (typer.Option(...)) as the idiomatic API.
"src/helios/cli/*.py" = ["B008"]


[tool.mypy]
python_version = "3.10"
packages = ["helios"]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
