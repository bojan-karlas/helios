  - value: Inguinal, pelvic or lower limb lymph node
  - value: Cervical lymph node
  - value: Central or intra-abdominal lymph node
  - value: Lymph node, NOS
  - value: Soft tissue of head, face and neck
  - value: Soft tissue of upper limb and shoulder
  - value: Soft tissue of trunk
  - value: Soft tissue of lower limb and hip
  - value: Soft tissue, NOS
  - value: Lung, NOS
  - value: Spinal cord
  - value: Brain, NOS
  - value: Small intestine, NOS
  - value: Liver, NOS
  - value: Pancreas, NOS
  - value: Bone, NOS
  - value: Spleen
  - value: Adrenal gland
  - value: Abdomen, NOS
  - value: Retroperitoneal space, NOS
  - value: Parotid gland
  - value: Vagina
  - value: Endometrium
  - value: Vulva
