  example: 2.5
- name: omics_purity_facets_auth
  type: float
  description: Purity value of the tumor sample based on the FACETS analysis method (author's version).
  caption: Tumor Purity (FACETS - Author)
  example: 0.7
- name: omics_genome_doubled_facets_auth
  type: boolean
  description: |
    Indicates whether genome doubling is present (True) or absent (False) based on the FACETS analysis method
    (author's version).
  caption: Genome Doubled (FACETS - Author)
  example: True
- name: omics_ploidy_facets_supp
  type: float
  description: Ploidy value of the tumor sample based on the FACETS analysis method (supplementary material version).
  caption: Tumor Ploidy (FACETS - Supplementary)
  example: 2.4
- name: omics_purity_facets_supp
  type: float
  description: Purity value of the tumor sample based on the FACETS analysis method (supplementary material version).
  caption: Tumor Purity (FACETS - Supplementary)
  example: 0.72
- name: omics_genome_doubled_facets_supp
  type: boolean
  description: |
    Indicates whether genome doubling is present (True) or absent (False) based on the FACETS analysis method
    (supplementary material version).
  caption: Genome Doubled (FACETS - Supplementary)
  example: True
- name: omics_ploidy_ascat
  type: float
  description: Ploidy value of the tumor sample based on the ASCAT analysis method.
  caption: Tumor Ploidy (ASCAT)
  example: 2.6
- name: omics_purity_ascat
  type: float
  description: Purity value of the tumor sample based on the ASCAT analysis method.
  caption: Tumor Purity (ASCAT)
  example: 0.68
- name: omics_genome_doubled_ascat
  type: boolean
  description: |
    Indicates whether genome doubling is present (True) or absent (False) based on the ASCAT analysis method.
  caption: Genome Doubled (ASCAT)
  example: False

