# ----------------------------------------------------------------------------------------------------------------------
# Data Dictionary for Pathology Image Metadata (version 0.1)
# ----------------------------------------------------------------------------------------------------------------------

# ----------------------------------------------------------------------------------------------------------------------
# Pathology Image Metadata Fields
# ----------------------------------------------------------------------------------------------------------------------

- name: image_id
  type: string
  description: Unique identifier for the pathology image.
  caption: Image ID
  example: MGH-SKCM-P00001-S01-B1-I1
- name: image_id_old
  type: string
  description: Previous identifier for the pathology image (e.g., when obtained from external sources).
  caption: Old Image ID
  example: BD2021_00016804
- name: image_scanning_site
  type: string
  description: Facility where the pathology image was scanned.
  caption: Scanning Site
  example: MGH-PATH-CORE
- name: image_group_id
  type: string
  description: |
    Identifier for the group of images in a given cohort that share the same scanning site and scanning date.
    This can be used to control for batch effects in image analysis.
  caption: Image Group ID
  example: OncDRS-2025
- name: image_specimen_type
  type: categorical
  description: Type of imaged specimen.
  caption: Specimen Type
  values:
  - value: FFPE
    description: Formalin-Fixed Paraffin-Embedded tissue.
  - value: FF
    description: Fresh Frozen tissue.
- name: image_width
  type: integer
  unit: pixels
  description: Width of the pathology image in pixels.
  caption: Image Width [px]
  example: 145920
- name: image_height
  type: integer
  unit: pixels
  description: Height of the pathology image in pixels.
  caption: Image Height [px]
  example: 36608
- name: image_mpp
  type: float
  unit: microns per pixel
  description: Microns per pixel for the pathology image, indicating the resolution.
  caption: Image Microns Per Pixel [µm/px]
  example: 0.2205752602788071
- name: image_magnification
  type: integer
  unit: zoom level
  description: Objective power used during image acquisition.
  caption: Image Magnification [x]
  example: 40
- name: image_quality_issue_present
  type: boolean
  description: Indicates whether any quality issues are present (True) or absent (False) in the pathology image.
  caption: Image Quality Issue Present
  example: False
- name: image_quality_issue_type
  type: categorical
  description: Type of quality issue present in the pathology image, if any.
  caption: Image Quality Issue Type
  values:
  - value: Blurry
  - value: Underexposed
  - value: Overexposed
  - value: Tissue folding
  - value: Air bubbles
  - value: Necrosis
  - value: Missing tissue

# ----------------------------------------------------------------------------------------------------------------------
# Patient Clinical Metadata Fields
# ----------------------------------------------------------------------------------------------------------------------

- name: patient_id
  type: string
  description: Unique identifier for the patient associated with the image.
  caption: Patient ID
  example: MGH-SKCM-P00001
- name: patient_treatment_site
  type: string
  description: Medical center where the patient received treatment.
  caption: Patient Treatment Site
- name: patient_last_followup_date
  type: date
  description: Date of the patient's last follow-up (i.e., last recorded contact).
  caption: Patient Last Follow-up Date
  example: 2017-09-02
- name: patient_os_death_date
  type: date
  description: Date of the patient's death, if applicable. Null if the patient is alive.
  caption: Patient Death Date
  example: 2017-09-02
- name: patient_os_death
  type: boolean
  description: Indicates whether the patient is deceased (True) or alive (False).
  caption: Patient Deceased
  example: True
- name: patient_dss_death
  type: boolean
  description: Indicates whether the patient died specifically from the disease (True) or from other causes (False).
  caption: Patient Deceased from Disease
  example: True
- name: patient_sex
  type: categorical
  description: Sex of the patient.
  caption: Patient Sex
  values:
  - value: Female
  - value: Male
- name: patient_race
  type: categorical
  description: Racial group of the patient.
  caption: Patient Race
  values:
  - value: White
  - value: Asian
  - value: Black or African American
  - value: Unknown/Other
- name: patient_history_contains_melanoma
  type: boolean
  description: Indicates whether the patient has a history of melanoma (True) or not (False).
  caption: Patient has History of Melanoma
  example: True

# ----------------------------------------------------------------------------------------------------------------------
# Disease-specific Metadata Fields
# ----------------------------------------------------------------------------------------------------------------------

- name: disease_diagnosis_date
  type: date
  description: Date when the disease was diagnosed.
  caption: Disease Diagnosis Date
  example: 2013-11-14
- name: disease_treatment_start_date
  type: date
  description: Date when the treatment for the disease started.
  caption: Disease Treatment Start Date
  example: 2013-12-05
- name: disease_age_at_diagnosis
  type: integer
  unit: years
  description: Age of the patient at the time of disease diagnosis.
  caption: Disease Age at Diagnosis [years]
  example: 81
- name: disease_os_days
  type: integer
  unit: days
  description: Overall survival time in days from diagnosis to death or last follow-up.
  caption: Disease Overall Survival [days]
  example: 1388
- name: disease_os_years
  type: float
  unit: years
  description: Overall survival time in years from diagnosis to death or last follow-up.
  caption: Disease Overall Survival [years]
  example: 3.8
- name: disease_dss_days
  type: integer
  unit: days
  description: Disease-specific survival time in days from diagnosis to death from the disease or last follow-up.
  caption: Disease-Specific Survival [days]
  example: 1388
- name: disease_dss_years
  type: float
  unit: years
  description: Disease-specific survival time in years from diagnosis to death from the disease or last follow-up.
  caption: Disease-Specific Survival [years]
  example: 3.8
- name: disease_pfs_recurred_date
  type: date
  description: Date when the disease recurred, if applicable.
  caption: Disease Recurrence Date
  example: 2016-10-21
- name: disease_pfs_recurred
  type: boolean
  description: Indicates whether the disease has recurred (True) or not (False).
  caption: Disease Recurrence
  example: True
- name: disease_pfs_recurred_days
  type: integer
  unit: days
  description: Progression-free survival time in days until disease recurrence.
  caption: Disease Recurrence-Free Survival [days]
  example: 1072
- name: disease_pfs_recurred_years
  type: float
  unit: years
  description: Progression-free survival time in years until disease recurrence.
  caption: Disease Recurrence-Free Survival [years]
  example: 2.93
- name: disease_pfs_recurred_locoregional
  type: boolean
  description: |
    Indicates whether the disease recurred (True) or not (False) locoregionally (i.e., near the original site
    or regional lymph nodes).
  caption: Disease Locoregional Recurrence
  example: True
- name: disease_pfs_recurred_locoregional_days
  type: integer
  unit: days
  description: Progression-free survival time in days until locoregional disease recurrence.
  caption: Disease Locoregional Recurrence-Free Survival [days]
  example: 1072
- name: disease_pfs_recurred_locoregional_years
  type: float
  unit: years
  description: Progression-free survival time in years until locoregional disease recurrence.
  caption: Disease Locoregional Recurrence-Free Survival [years]
  example: 2.93
- name: disease_pfs_recurred_distant
  type: boolean
  description: |
    Indicates whether the disease recurred (True) or not (False) at distant sites (i.e., distant metastasis).
  caption: Disease Distant Recurrence
  example: True
- name: disease_pfs_recurred_distant_days
  type: integer
  unit: days
  description: Progression-free survival time in days until distant disease recurrence.
  caption: Disease Distant Recurrence-Free Survival [days]
  example: 1072
- name: disease_pfs_recurred_distant_years
  type: float
  unit: years
  description: Progression-free survival time in years until distant disease recurrence.
  caption: Disease Distant Recurrence-Free Survival [years]
  example: 2.93
- name: disease_pfs_recurred_5yfu
  type: boolean
  description: Indicates whether the disease recurred (True) or not (False) within a 5-year follow-up period.
  caption: Disease 5-Year Follow-up Recurrence
  example: True
- name: disease_pfs_progressed
  type: boolean
  description: Indicates whether the disease has progressed (True) or not (False).
  caption: Disease Progression
  example: True
- name: disease_pfs_progressed_days
  type: integer
  unit: days
  description: Progression-free survival time in days until disease progression.
  caption: Disease Progression-Free Survival [days]
  example: 1072
- name: disease_pfs_progressed_years
  type: float
  unit: years
  description: Progression-free survival time in years until disease progression.
  caption: Disease Progression-Free Survival [years]
  example: 2.93
- name: disease_slnb_performed
  type: boolean
  description: Indicates whether a sentinel lymph node biopsy (SLNB) was performed (True) or not (False).
  caption: Disease SLNB Performed
  example: True
- name: disease_slnb_positive
  type: boolean
  description: Indicates whether the sentinel lymph node biopsy (SLNB) was positive (True) or negative (False).
  caption: Disease SLNB Positive
  example: True

# ----------------------------------------------------------------------------------------------------------------------
