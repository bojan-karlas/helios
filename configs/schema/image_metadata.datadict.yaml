  - value: Lymph node
  - value: Soft tissue
  - value: Other
- name: sample_metastatic
  type: boolean
  description: Indicates whether the tissue sample is metastatic (True) or primary (False).
  caption: Sample Metastatic
  example: False

# ----------------------------------------------------------------------------------------------------------------------
# Tumor Pathological Staging Metadata Fields
# ----------------------------------------------------------------------------------------------------------------------

- name: path_stage
  type: categorical
  description: Pathological stage of the disease at time of diagnosis.
  caption: Disease Stage
  values:
  - value: 0
  - value: 1
  - value: 2
  - value: 3
  - value: 4
- name: path_stage_substage
  type: categorical
  description: Substage of the pathological stage.
  caption: Disease Substage
  values:
  - value: "0"
  - value: 1A
  - value: 1B
  - value: 2A
  - value: 2B
  - value: 2C
  - value: 3A
  - value: 3B
  - value: 3C
  - value: 3D
  - value: "4"
- name: path_stage_tumor
  type: categorical
  description: Tumor (T) component of the pathological stage (based on AJCC 8th edition).
  caption: Disease Stage (Tumor Component)
  values:
  - value: TX
    description: Primary tumor cannot be assessed.
  - value: T0
    description: No evidence of primary tumor.
  - value: Tis
    description: Melanoma in situ.
  - value: T1
    description: Tumor thickness ≤1.0 mm.
  - value: T2
    description: Tumor thickness 1.01-2.0 mm.
  - value: T3
    description: Tumor thickness 2.01-4.0 mm.
  - value: T4
    description: Tumor thickness >4.0 mm.
- name: path_stage_tumor_substage
  type: categorical
  description: Tumor (T) component of the pathological stage and substage (based on AJCC 8th edition).
  caption: Disease Substage (Tumor Component)
  values:
  - value: TX
    description: Primary tumor cannot be assessed.
  - value: T0
    description: No evidence of primary tumor.
  - value: Tis
    description: Melanoma in situ.
  - value: T1a
    description: Tumor thickness ≤0.8 mm without ulceration.
  - value: T1b
    description: Tumor thickness ≤0.8 mm with ulceration or tumor thickness 0.8-1.0 mm with or without ulceration.
  - value: T2a
    description: Tumor thickness 1.01-2.0 mm without ulceration.
  - value: T2b
    description: Tumor thickness 1.01-2.0 mm with ulceration.
  - value: T3a
    description: Tumor thickness 2.01-4.0 mm without ulceration.
  - value: T3b
    description: Tumor thickness 2.01-4.0 mm with ulceration.
  - value: T4a
    description: Tumor thickness >4.0 mm without ulceration.
  - value: T4b
    description: Tumor thickness >4.0 mm with ulceration.
- name: path_stage_lymph
  type: categorical
  description: Lymph node (N) component of the pathological stage (based on AJCC 8th edition).
  caption: Disease Stage (Lymph Node Component)
  values:
  - value: NX
    description: Regional lymph nodes cannot be assessed.
  - value: N0
    description: No regional lymph node metastasis.
  - value: N1
    description: Metastasis in 1 regional lymph node.
  - value: N2
    description: |
      Metastasis in 2-3 regional lymph nodes or in-transit, satellite, and/or microsatellite metastases
      without metastatic regional lymph nodes.
  - value: N3
    description: |
      Metastasis in 4 or more regional lymph nodes; or metastasis in regional lymph nodes with in-transit,
      satellite, and/or microsatellite metastases.
- name: path_stage_lymph_substage
  type: categorical
  description: Lymph node (N) component of the pathological stage and substage (based on AJCC 8th edition).
  caption: Disease Substage (Lymph Node Component)
  values:
  - value: NX
    description: Regional lymph nodes cannot be assessed.
  - value: N0
    description: No regional lymph node metastasis.
  - value: N1a
    description: |
      Metastasis in 1 regional lymph node, clinically occult. No in-transit, satellite, or microsatellite metastases.
  - value: N1b
    description: |
      Metastasis in 1 regional lymph node, clinically detected. No in-transit, satellite, or microsatellite
      metastases.
  - value: N2a
    description: |
      Metastasis in 2-3 regional lymph nodes, clinically occult. No in-transit, satellite, or microsatellite
      metastases.
  - value: N2b
    description: |
      Metastasis in 2-3 regional lymph nodes, clinically detected. No in-transit, satellite, or microsatellite
      metastases.
  - value: N2c
    description: |
      In-transit, satellite, and/or microsatellite metastases without metastatic regional lymph nodes.
  - value: N3a
    description: |
      Metastasis in 4 or more regional lymph nodes, clinically occult. May include in-transit, satellite, and/or
      microsatellite metastases.
  - value: N3b
    description: |
      Metastasis in 4 or more regional lymph nodes, clinically detected. May include in-transit, satellite, and/or
      microsatellite metastases.
  - value: N3c
    description: |
      Metastasis in regional lymph nodes with in-transit, satellite, and/or microsatellite metastases.
- name: path_stage_metastasis
  type: categorical
  description: Distant metastasis (M) component of the pathological stage (based on AJCC 8th edition).
  caption: Disease Stage (Distant Metastasis Component)
  values:
  - value: MX
    description: Distant metastasis cannot be assessed.
  - value: M0
    description: No distant metastasis.
  - value: M1
    description: Distant metastasis present.
- name: path_stage_metastasis_substage
  type: categorical
  description: Distant metastasis (M) component of the pathological stage (based on AJCC 8th edition).
  caption: Disease Substage (Distant Metastasis Component)
  values:
  - value: MX
    description: Distant metastasis cannot be assessed.
  - value: M0
    description: No distant metastasis.
  - value: M1a
    description: Distant metastasis to skin, subcutaneous tissues, or distant lymph nodes.
  - value: M1b
    description: Distant metastasis to lung.
  - value: M1c
    description: Distant metastasis to non-CNS visceral sites.
  - value: M1d
    description: Distant metastasis to central nervous system (CNS) with or without other sites.

# ----------------------------------------------------------------------------------------------------------------------
# Tumor Pathology Metadata Fields
# ----------------------------------------------------------------------------------------------------------------------

- name: path_histologic_subtype
  type: categorical
  description: Histologic subtype of the pathology.
  caption: Histologic Subtype
  values:
  - value: Superficial spreading melanoma
  - value: Nodular melanoma
  - value: Lentigo maligna melanoma
  - value: Acral lentiginous melanoma
  - value: Melanoma, NOS
  - value: Desmoplastic melanoma
  - value: Mucosal melanoma
  - value: Occult melanoma
- name: path_thickness
  type: float
  unit: millimeters
  description: Thickness of the tumor in millimeters.
  caption: Tumor Thickness [mm]
  example: 5.1
- name: path_ulceration_present
  type: boolean
  description: Indicates whether ulceration is present (True) or absent (False) in the tumor pathology.
  caption: Tumor Ulceration Present
  example: False
- name: path_anatomic_level
  type: categorical
  description: Anatomic (Clark) level of the tumor. Values range from 1 to 5.
  caption: Tumor Anatomic (Clark) Level
  values:
  - value: 1
  - value: 2
  - value: 3
  - value: 4
  - value: 5
- name: path_mitoses_rate
  type: integer
  description: |
    Number of mitoses per square millimeter in the tumor pathology. They are estimated by the pathologist while
    examining 10 high-power fields (HPF).
  caption: Tumor Mitotic Rate [per mm²]
  example: 3
- name: path_mitoses_present
  type: boolean
  description: Indicates whether mitoses are present (True) or absent (False) in the tumor pathology.
  caption: Tumor Mitoses Present
  example: True
- name: path_microsatellites_present
  type: boolean
  description: Indicates whether microsatellites are present (True) or absent (False) in the tumor pathology.
  caption: Tumor Microsatellites Present
  example: False
- name: path_radial_growth_present
  type: boolean
  description: Indicates whether radial growth phase is present (True) or absent (False) in the tumor pathology.
  caption: Tumor Radial Growth Present
  example: True
- name: path_vertical_growth_present
  type: boolean
  description: Indicates whether vertical growth phase is present (True) or absent (False) in the tumor pathology.
  caption: Tumor Vertical Growth Present
  example: True
- name: path_vertical_growth_type
  type: categorical
  description: Type of vertical growth phase in the tumor pathology.
  caption: Tumor Vertical Growth Type
  values:
  - value: Absent
  - value: Epithelioid
  - value: Epithelioid and small cell
  - value: Epithelioid and spindled
  - value: Small cell
  - value: Spindled
  - value: Other
- name: path_precursor_lesion_present
  type: boolean
  description: Indicates whether a precursor lesion is present (True) or absent (False) in the tumor pathology.
  caption: Precursor Lesion Present
  example: False
- name: path_precursor_lesion_type
  type: categorical
  description: Type of precursor lesion present in the tumor pathology.
  caption: Precursor Lesion Type
  values:
  - value: Benign nevus
  - value: Dysplastic nevus
  - value: Lentigo maligna
- name: path_til_presence
  type: boolean
  description: |
    Indicates whether tumor-infiltrating lymphocytes (TILs) are present (True) or absent (False) in the tumor pathology.
  caption: TIL Presence
  example: True
- name: path_til_pattern
  type: categorical
  description: Pattern of tumor-infiltrating lymphocytes (TILs) present in the tumor pathology.
  caption: TIL Pattern
  values:
  - value: Absent
  - value: Non-brisk
  - value: Brisk
- name: path_regression_present
  type: boolean
  description: Indicates whether regression is present (True) or absent (False) in the tumor pathology.
  caption: Regression Present
  example: False
- name: path_perineural_invasion_present
  type: boolean
  description: Indicates whether perineural invasion is present (True) or absent (False) in the tumor pathology.
  caption: Perineural Invasion Present
  example: False
- name: path_lymphovascular_invasion_present
  type: boolean
  description: Indicates whether lymphovascular invasion is present (True) or absent (False) in the tumor pathology.
  caption: Lymphovascular Invasion Present
  example: False
- name: path_wle_margin
  type: float
  unit: millimeters
  description: Width of the wide local excision (WLE) margin in millimeters.
  caption: Wide Local Excision Margin [mm]
  example: 2

# ----------------------------------------------------------------------------------------------------------------------
# Omics Fields: Ploidy, Purity, and Genome Doubling
# ----------------------------------------------------------------------------------------------------------------------


- name: omics_braf_mutation_present
  type: boolean
  description: Indicates whether a BRAF mutation is present (True) or absent (False) in the tissue sample.
  caption: Sample BRAF Mutation Present
  example: True
- name: omics_nras_mutation_present
  type: boolean
  description: Indicates whether an NRAS mutation is present (True) or absent (False) in the tissue sample.
  caption: Sample NRAS Mutation Present
  example: False
- name: omics_tumor_mutation_burden
  type: float
  unit: mutations per megabase
  description: Tumor mutation burden (TMB) of the tissue sample, measured in mutations per megabase.
  caption: Sample Tumor Mutation Burden [mut/Mb]
  example: 12.5
- name: omics_ploidy_absolute
  type: float
  description: Ploidy value of the tumor sample based on the ABSOLUTE analysis method.
