# Example user config (copy + edit; keep your real paths OUT of version control).
version: v001

paths:
  source: /path/to/cohort/source     # read-only: wsi/, metadata/
  work:   /path/to/cohort/work
  output: /path/to/cohort/output
  models: /path/to/models
  base:   /path/to/cohort            # fallback for any unset role

cv:
  n_folds: 5
  group_by: patient_id
  seed: 42

partitions:
  size_mm: [0.250]
  model: [virchow2, uni2]
  target: [MGB+MRV]
